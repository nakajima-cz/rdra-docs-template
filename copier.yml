# copier テンプレート設定
_min_copier_version: "9.0.0"

# テンプレート本体を template/ サブディレクトリに置く（copier.yml等と分離）
_subdirectory: template

# 上書き保護（方針A: 骨組みは copier のマージに任せて更新伝播、中身の実体だけ保護）
# - 保護する = 利用者が埋める実体（画面/API個票、ADR本体、対応表、用語集）
# - 保護しない = 骨組み（各README・_template・common規約）→ テンプレ改善が copier update で伝播
_skip_if_exists:
  - "/README.md"
  - "/CLAUDE.md"
  - "docs/specs/screens/SCR-*.md"
  - "docs/specs/apis/API-*.md"
  - "docs/adr/[0-9]*.md"
  - "docs/traceability/screen-uc-api.md"
  - "docs/glossary.md"
  - "docs/LOG.md"
  - "/.claude/settings.json"

# 生成後に実行（gitフックを .git/hooks ではなく .githooks に向ける）
# copier update の内部再生成は非gitのtempで走るため、git repo内でのみ実行するようガード
_tasks:
  - "git rev-parse --git-dir >/dev/null 2>&1 && git config core.hooksPath .githooks || true"
  - "chmod +x .githooks/* 2>/dev/null || true"
  - "chmod +x scripts/docs-sync/*.sh scripts/figma-export/*.sh scripts/docs-validate/*.py 2>/dev/null || true"

# ---- 質問 ----
project_name:
  type: str
  help: プロジェクト名（ルートREADMEの見出しに使う）
  default: "My Project"

use_claude_hook:
  type: bool
  help: Claude Code の Stop フックで docs 自動メンテを有効にするか
  default: true

hook_manager:
  type: str
  help: 既存の git フック管理
  choices:
    素の core.hooksPath を使う: none
    husky を使っている: husky
    lefthook を使っている: lefthook
  default: none
