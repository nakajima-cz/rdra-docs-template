# copier テンプレート設定
_min_copier_version: "9.0.0"

# テンプレート本体を template/ サブディレクトリに置く（copier.yml等と分離）
_subdirectory: template

# 上書き保護（方針: 人が手を入れる docs は全部保護、機械が持つ骨組みだけ伝播）
# - 保護する = 利用者が書き換える前提のファイル（docs/ 配下の本文・索引・README・共通規約）
#   → copier update で 3-way マージ衝突（<<<<<<< マーカー）が起きないようにする
# - 保護しない = テンプレ本体の仕組み: scripts/ .githooks/ .claude/commands/ と
#   各 `_template.md` / `adr/template.md`（雛形はテンプレ改善を伝播させたい）
_skip_if_exists:
  # ルート
  - "/README.md"
  - "/CLAUDE.md"
  - "/.claude/settings.json"
  - "/.docs-scaffold/config.sh"
  # docs 直下
  - "docs/README.md"
  - "docs/p00-brief.md"
  - "docs/WORKFLOW.md"
  - "docs/glossary.md"
  - "docs/LOG.md"
  # RDRA（要件の本文。利用者が表を埋める）
  - "docs/rdra/*/README.md"
  # 設計書（個票・索引・共通規約。_template.md は保護しない＝伝播させる）
  - "docs/specs/screens/SCR-*.md"
  - "docs/specs/screens/README.md"
  - "docs/specs/screens/screenshots/README.md"
  - "docs/specs/apis/API-*.md"
  - "docs/specs/apis/README.md"
  - "docs/specs/batches/BATCH-*.md"
  - "docs/specs/batches/README.md"
  - "docs/specs/common/*.md"
  # ADR（本体と索引。template.md は保護しない＝伝播させる）
  - "docs/adr/[0-9]*.md"
  - "docs/adr/README.md"
  # 対応表
  - "docs/traceability/screen-uc-api.md"
  - "docs/traceability/uc-api.md"
  - "docs/traceability/uc-batch.md"
  # 図版の置き場
  - "docs/assets/README.md"

# 生成後に実行
# - pre-push ゲートの配線は hook_manager の回答に応じて install.sh が行う
#   （none=core.hooksPath / husky=.husky/pre-push へ追記 / lefthook=lefthook.yml）
# - copier update の内部再生成は非gitのtempで走るが、install.sh 側で git repo 判定してスキップする
_tasks:
  - "chmod +x .githooks/* scripts/docs-hooks/*.sh 2>/dev/null || true"
  - "bash scripts/docs-hooks/install.sh {{ hook_manager }} || true"
  - "chmod +x scripts/docs-sync/*.sh scripts/docs-validate/*.py 2>/dev/null || true"
  - "chmod +x scripts/figma-export/*.sh 2>/dev/null || true"

# ---- 質問 ----
project_name:
  type: str
  help: プロジェクト名（ルートREADMEの見出しに使う）
  default: "My Project"

components:
  type: str
  multiselect: true
  help: |-
    このプロジェクトが持つ構成要素（複数選択可）。選んだものだけ指示テンプレと設計書の置き場が配布される
  choices:
    画面（フロントエンド）: screens
    API（バックエンド）: apis
    バッチ・定期処理: batch
  # 旧 use_screens 回答を持つ既存プロジェクトは、その値から初期選択を決める
  default: "{{ (['screens', 'apis'] if use_screens else ['apis']) if use_screens is defined else ['screens', 'apis'] }}"

# 以下3つは components から導出する（質問しない）
use_screens:
  type: bool
  default: "{{ 'screens' in components }}"
  when: false

use_apis:
  type: bool
  default: "{{ 'apis' in components }}"
  when: false

use_batch:
  type: bool
  default: "{{ 'batch' in components }}"
  when: false

use_figma:
  type: bool
  help: Figma 連携スクリプト（scripts/figma-export）を同梱するか
  default: "{{ use_screens }}"
  when: "{{ use_screens }}"

source_dirs:
  type: str
  help: 実装ソースのディレクトリ（スペース区切り。docs 未更新警告と docs-sync の対象範囲）
  default: "src app lib api server packages"

docs_sync_agent:
  type: str
  help: docs 自動同期に使うコーディングエージェント
  choices:
    Claude Code: claude
    OpenAI Codex CLI: codex
    OpenCode: opencode
    任意コマンド（docs_sync_cmd で指定）: custom
    使わない（差分出力のみ・手動更新）: none
  default: claude

docs_sync_cmd:
  type: str
  help: docs_sync_agent=custom のとき実行するコマンド（プロンプトが最後の引数で渡る）
  default: ""
  when: "{{ docs_sync_agent == 'custom' }}"

use_claude_hook:
  type: bool
  help: Claude Code の Stop フックで docs 自動メンテを有効にするか
  default: "{{ docs_sync_agent == 'claude' }}"
  when: "{{ docs_sync_agent == 'claude' }}"

hook_manager:
  type: str
  help: 既存の git フック管理（pre-push ゲートの配線先を決める）
  choices:
    素の core.hooksPath を使う（.githooks）: none
    husky を使っている（.husky/pre-push へ追記）: husky
    lefthook を使っている（lefthook.yml へ配線）: lefthook
  default: none
